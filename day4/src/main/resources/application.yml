server:
  port: 8080

spring:
  application:
    name: api-gateway
  
  cloud:
    gateway:
      routes:
        # Auth Service Route (permits all auth controllers)
        - id: auth-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**
            
        # Movie Service Route (requires validation)
        - id: movie-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/movies/**, /api/reviews/**
          filters:
            - AddRequestHeader=X-Gateway-Token, GatewayPass

        # Uploaded Movie Posters Static Route
        - id: uploads-static-route
          uri: http://localhost:8082
          predicates:
            - Path=/uploads/**

        # Booking Service Route (requires validation)
        - id: booking-service-route
          uri: http://localhost:8083
          predicates:
            - Path=/api/bookings/**, /api/orders/**
          filters:
            - AddRequestHeader=X-Gateway-Token, GatewayPass

        # User Service Route (requires validation)
        - id: user-service-route
          uri: http://localhost:8084
          predicates:
            - Path=/api/users/**

# Custom property for JWT secret (shared with Auth Service)
jwt:
  secret: 9a67a86c4e5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c
