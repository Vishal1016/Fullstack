# ==========================================
# JDBC Datasource Configurations (PostgreSQL)
# ==========================================
# NOTE: Ensure the database 'cinepass' is created in PostgreSQL before running.
# Example: CREATE DATABASE cinepass;
spring.datasource.url=jdbc:postgresql://localhost:5432/cinepass
spring.datasource.username=postgres

# CHANGE THIS TO YOUR ACTUAL LOCAL POSTGRESQL PASSWORD
spring.datasource.password=postgres

spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / Hibernate Configurations
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# Security & Session Configurations
# ==========================================
# Secure 256-bit Hex signature key for JWT signing (HMAC-SHA256)
spring.security.jwt.secret=9a67a86c4e5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c
# 24 hour expiration in milliseconds
spring.security.jwt.expiration-ms=86400000

# ==========================================
# Server Port Configuration
# ==========================================
server.port=8081
